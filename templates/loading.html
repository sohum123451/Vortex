<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="refresh" content="3">
    <title>Vortex — Connecting</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #0d0f14;
            margin: 0;
            padding: 24px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #f8fafc;
            text-align: center;
        }
        .loading-card {
            background: #141720;
            border: 1px solid #202532;
            border-radius: 20px;
            padding: 44px 28px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        .spinner {
            font-size: 2.8rem;
            color: #5865f2;
            margin-bottom: 20px;
            animation: spin 1.2s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
        }
        p {
            color: #94a3b8;
            font-size: 0.92rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="loading-card">
        <div class="spinner"><i class="fa-solid fa-circle-notch"></i></div>
        <h2>Connecting to Discord...</h2>
        <p>Vortex is syncing gateway events and server state. This page will automatically refresh once ready.</p>
    </div>
</body>
</html>
